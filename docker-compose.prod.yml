# Production — déploiement sur VM avec sous-domaine propre.
#
# Architecture :
#   Internet → nginx de l'hôte (80/443, TLS certbot)
#               └── log.bpmclubsono.com → 127.0.0.1:8082 → frontend:80
#                                                            └── /api/* → api:8000
#
# Le reverse proxy public est le nginx **de la VM**, partagé avec les autres
# sites (bpmclubsono.com, auth.bpmclubsono.com) : la stack ne peut donc pas
# prendre les ports 80/443 et n'embarque aucun proxy à elle.
# Le nginx *de l'image frontend* (frontend/nginx.conf) route déjà /api/ vers
# l'API : l'hôte n'a qu'un seul upstream à connaître, le frontend.
#
# La base et l'API n'ont aucun port exposé. Le frontend n'est publié que sur la
# loopback : rien n'est joignable depuis l'extérieur sans passer par nginx.
#
# Pré-requis sur la VM :
#   - nginx : vhost log.bpmclubsono.com → proxy_pass http://127.0.0.1:8082
#     (+ client_max_body_size 20M pour les photos de tickets)
#   - certbot --nginx -d log.bpmclubsono.com
#   - Enregistrement DNS A : log.bpmclubsono.com → IP de la VM
#
# Lancer :
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: bpm_log_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bpm_log}
    # Pas de `ports:` → la base n'est accessible que depuis le réseau Docker interne.
    volumes:
      - bpm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-bpm_log}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bpm_log_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bpm_log}
    # Pas de `ports:` → joignable uniquement par le frontend, via le réseau Docker interne.
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - bpm_photos:/var/bpm/photos
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_OIDC_ISSUER: ${VITE_OIDC_ISSUER}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID}
    container_name: bpm_log_frontend
    restart: unless-stopped
    # Publié sur la loopback uniquement : seul le nginx de l'hôte y accède.
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bpm_pgdata:
  bpm_photos:
